openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Agro Vision Hub API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: crops
  - name: scans
  - name: settings
  - name: profile
  - name: dashboard
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /crops:
    get:
      operationId: listCrops
      tags: [crops]
      summary: List supported crops
      responses:
        "200":
          description: Supported crop catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Crop"

  /scans:
    get:
      operationId: listScans
      tags: [scans]
      summary: List the user's scan history
      responses:
        "200":
          description: List of scans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scan"
    post:
      operationId: createScan
      tags: [scans]
      summary: Analyze an uploaded crop leaf image
      description: Validates that the uploaded image contains the selected crop's leaf and returns disease analysis. Rejects anything that is not a crop leaf.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cropId: { type: string }
                imageDataUrl:
                  type: string
                  description: Data URL of the uploaded leaf image
              required: [cropId, imageDataUrl]
      responses:
        "200":
          description: Scan analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "400":
          description: Invalid image (not a crop leaf, or wrong crop)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanError"
  /scans/{id}:
    get:
      operationId: getScan
      tags: [scans]
      summary: Get a single scan by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: A scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanError"
    delete:
      operationId: deleteScan
      tags: [scans]
      summary: Delete a scan
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard summary stats
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/recent:
    get:
      operationId: getDashboardRecent
      tags: [dashboard]
      summary: Recent activity for the dashboard
      responses:
        "200":
          description: Recent scans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scan"
  /dashboard/tips:
    get:
      operationId: getDashboardTips
      tags: [dashboard]
      summary: Daily AI farming tips
      responses:
        "200":
          description: Tips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tip"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get the current user's settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                language: { type: string }
                theme: { type: string }
                units: { type: string }
                temperatureUnit: { type: string }
                notificationsEnabled: { type: boolean }
                scanReminders: { type: boolean }
                weatherAlerts: { type: boolean }
                marketingEmails: { type: boolean }
                autoSaveScans: { type: boolean }
                highAccuracyMode: { type: boolean }
                offlineMode: { type: boolean }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the current user's profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    put:
      operationId: updateProfile
      tags: [profile]
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string }
                farmName: { type: string }
                location: { type: string }
                bio: { type: string }
                photoUrl: { type: string }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    delete:
      operationId: deleteAccount
      tags: [profile]
      summary: Delete the current user's account and all data
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    Crop:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        scientificName: { type: string }
        description: { type: string }
        imageUrl: { type: string }
        commonDiseases:
          type: array
          items: { type: string }
        season: { type: string }
        difficulty: { type: string }
      required: [id, name, scientificName, description, imageUrl, commonDiseases, season, difficulty]
    Scan:
      type: object
      properties:
        id: { type: integer }
        cropId: { type: string }
        cropName: { type: string }
        imageDataUrl: { type: string }
        status: { type: string, description: "healthy | diseased | invalid" }
        diseaseName: { type: string, nullable: true }
        confidence: { type: number, nullable: true }
        severity: { type: string, nullable: true }
        summary: { type: string }
        symptoms:
          type: array
          items: { type: string }
        treatment:
          type: array
          items: { type: string }
        prevention:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, cropId, cropName, imageDataUrl, status, summary, symptoms, treatment, prevention, createdAt]
    ScanError:
      type: object
      properties:
        error: { type: string }
        reason: { type: string }
      required: [error, reason]

    DashboardSummary:
      type: object
      properties:
        totalScans: { type: integer }
        healthyCount: { type: integer }
        diseasedCount: { type: integer }
        invalidCount: { type: integer }
        healthScore: { type: number }
        cropsAnalyzed: { type: integer }
        lastScanAt: { type: string, nullable: true }
        weeklyTrend:
          type: array
          items:
            type: object
            properties:
              day: { type: string }
              healthy: { type: integer }
              diseased: { type: integer }
            required: [day, healthy, diseased]
        diseaseBreakdown:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              count: { type: integer }
            required: [name, count]
      required: [totalScans, healthyCount, diseasedCount, invalidCount, healthScore, cropsAnalyzed, weeklyTrend, diseaseBreakdown]

    Tip:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        icon: { type: string }
      required: [id, title, body, icon]

    Settings:
      type: object
      properties:
        language: { type: string }
        theme: { type: string, description: "light | dark | system" }
        units: { type: string, description: "metric | imperial" }
        temperatureUnit: { type: string, description: "celsius | fahrenheit" }
        notificationsEnabled: { type: boolean }
        scanReminders: { type: boolean }
        weatherAlerts: { type: boolean }
        marketingEmails: { type: boolean }
        autoSaveScans: { type: boolean }
        highAccuracyMode: { type: boolean }
        offlineMode: { type: boolean }
      required: [language, theme, units, temperatureUnit, notificationsEnabled, scanReminders, weatherAlerts, marketingEmails, autoSaveScans, highAccuracyMode, offlineMode]
    Profile:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        fullName: { type: string }
        farmName: { type: string }
        location: { type: string }
        bio: { type: string }
        photoUrl: { type: string }
      required: [id, email, fullName, farmName, location, bio, photoUrl]
